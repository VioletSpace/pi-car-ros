# Steamdeck Configuration for Robot Teleoperation

/steamdeck_joy_teleop/teleop_twist_joy:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.4
    scale_linear_turbo:
      x: 1.0
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 1.0
    scale_angular_turbo:
      yaw: 1.0
    enable_button: 9
    enable_turbo_button: 10

/steamdeck_joy_teleop/joy_node:
  ros__parameters:
    deadzone: 0.05
    autorepeat_rate: 20.0
    dev: /dev/input/js0

